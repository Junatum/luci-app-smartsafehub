name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: |
          sh -n root/usr/libexec/smartsafehub-updater
          sh -n tests/test-updater.sh

      - name: Validate JSON files
        run: |
          find root/usr/share/rpcd/acl.d \
               root/usr/share/luci/menu.d \
               -type f -name '*.json' \
               -print0 |
            xargs -0 -n1 jq empty

      - name: Run updater tests
        run: |
          ./tests/test-updater.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
