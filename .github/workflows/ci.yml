name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellSpec
        env:
          SHELLSPEC_VERSION: 0.28.1
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/lib"
          git clone --depth 1 --branch "$SHELLSPEC_VERSION" \
            https://github.com/shellspec/shellspec.git "$HOME/.local/lib/shellspec"
          ln -s "$HOME/.local/lib/shellspec/shellspec" "$HOME/.local/bin/shellspec"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/shellspec" --version

      - name: Install OpenWrt-compatible ucode compiler
        env:
          UCODE_REF: 8592205
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libjson-c-dev pkg-config
          git clone https://github.com/jow-/ucode.git "$RUNNER_TEMP/ucode"
          git -C "$RUNNER_TEMP/ucode" checkout --detach "$UCODE_REF"
          cmake \
            -S "$RUNNER_TEMP/ucode" \
            -B "$RUNNER_TEMP/ucode-build" \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/ucode-build" --parallel
          test -x "$RUNNER_TEMP/ucode-build/ucode"
          echo "$RUNNER_TEMP/ucode-build" >> "$GITHUB_PATH"

      - name: Run tests
        shell: bash
        env:
          SMARTSAFEHUB_REQUIRE_UCODE: '1'
        run: shellspec

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate committed production assets
        run: |
          test -s ../root/www/luci-static/smartsafehub/app.js
          test -s ../root/www/luci-static/smartsafehub/app.css
          test ! -e ../root/www/luci-static/smartsafehub/index.html
          git -C .. diff --exit-code -- root/www/luci-static/smartsafehub/
