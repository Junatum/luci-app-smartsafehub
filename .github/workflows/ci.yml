name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate executable permissions and package metadata
        run: ./tests/test-package-contract.sh

      - name: Validate shell scripts
        run: |
          sh -n root/etc/init.d/smartsafehub-updater
          sh -n root/usr/libexec/smartsafehub-updater
          sh -n tests/test-package-contract.sh
          sh -n tests/test-rpc-contract.sh
          sh -n tests/test-ucode-imports.sh
          sh -n tests/test-updater.sh

      - name: Validate JSON files
        run: |
          find root/usr/share/rpcd/acl.d \
               root/usr/share/luci/menu.d \
               -type f -name '*.json' \
               -print0 |
            xargs -0 -r -n1 jq empty

      - name: Validate ucode imports
        run: ./tests/test-ucode-imports.sh

      - name: Validate RPC and ACL contract
        run: ./tests/test-rpc-contract.sh

      - name: Run updater tests
        run: ./tests/test-updater.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate committed production assets
        run: |
          test -s ../root/www/luci-static/smartsafehub/app.js
          test -s ../root/www/luci-static/smartsafehub/app.css
          test ! -e ../root/www/luci-static/smartsafehub/index.html
          git -C .. diff --exit-code -- root/www/luci-static/smartsafehub/
